services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3050:3050"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3050
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-todo}?schema=public
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en el .env, generalo con openssl rand -hex 32}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      NOTIFICATION_SERVICE_URL: http://notification:3060
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3040}
    depends_on:
      postgres:
        condition: service_healthy
      notification:
        condition: service_started

  notification:
    build:
      context: .
      dockerfile: packages/notification/Dockerfile
    ports:
      - "3060:3060"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3060
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-notifications}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE: http://${PUBLIC_HOST:-localhost}:3050
        VITE_WS_URL: ws://${PUBLIC_HOST:-localhost}:3060
    ports:
      - "3040:3040"
    depends_on:
      - backend
      - notification

volumes:
  pgdata:
  mongodata:
